<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PathSnap Evaluator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { font: 15px system-ui, sans-serif; margin: 0; color: #172033; background: #f5f7fb; }
    main { max-width: 1200px; margin: auto; padding: 24px; }
    textarea { width: 100%; min-height: 260px; box-sizing: border-box; font: 13px ui-monospace, monospace; }
    button { padding: 9px 16px; margin: 10px 6px 10px 0; cursor: pointer; }
    #map { height: 520px; background: #ddd; }
    .card { background: white; padding: 16px; margin: 12px 0; border-radius: 8px; box-shadow: 0 1px 5px #ccd2df; }
    .status { white-space: pre-wrap; color: #334155; }
    .legend span { display: inline-block; margin-right: 16px; }
    .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; border-bottom: 1px solid #e2e8f0; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
  </style>
</head>
<body>
<main>
  <h1>PathSnap evaluator</h1>
  <p>Submit candidate features generated by <code>src.features.build_features</code>. The API selects the highest-scoring candidate per GPS observation.</p>
  <div class="card">
    <label for="api">API URL</label>
    <input id="api" size="35">
    <button id="sample">Load sample</button>
    <button id="run">Run prediction</button>
    <textarea id="payload" aria-label="Prediction JSON"></textarea>
    <div id="status" class="status"></div>
  </div>
  <div class="card">
    <h2>Model accuracy log</h2>
    <table>
      <thead><tr><th>Model</th><th>CV Macro F1</th><th>Top-1 Accuracy</th><th>Student-Test Macro F1</th><th>Log Loss</th></tr></thead>
      <tbody id="metrics"><tr><td colspan="5">Loading...</td></tr></tbody>
    </table>
  </div>
  <div class="card">
    <h2>Route map</h2>
    <div class="legend">
      <span><i class="dot" style="background:#2563eb"></i>GPS</span>
      <span><i class="dot" style="background:#16a34a"></i>Reference</span>
      <span><i class="dot" style="background:#dc2626"></i>Predicted</span>
    </div>
    <div id="map"></div>
  </div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const features = ["distance_m","heading_delta_deg","projection_ratio","distance_rank","segment_length_m","speed_mps","dt_s","heading_valid","gap_before","zero_length_arc"];
document.querySelector("#api").value = window.location.origin;
const sample = {observations: [
  {obs_idx: 0, gps: [51.0501, 13.7372], candidates: [
    {arc_id: 101, features: {distance_m: 4, heading_delta_deg: 8, projection_ratio: .4, distance_rank: 1, segment_length_m: 80, speed_mps: 8, dt_s: 1, heading_valid: true, gap_before: false, zero_length_arc: false}, geometry: [[51.0500,13.7370],[51.0502,13.7375]]},
    {arc_id: 102, features: {distance_m: 20, heading_delta_deg: 70, projection_ratio: .3, distance_rank: 2, segment_length_m: 75, speed_mps: 8, dt_s: 1, heading_valid: true, gap_before: false, zero_length_arc: false}, geometry: [[51.0498,13.7370],[51.0500,13.7375]]}
  ]},
  {obs_idx: 1, gps: [51.0502, 13.7375], candidates: [
    {arc_id: 103, features: {distance_m: 3, heading_delta_deg: 5, projection_ratio: .6, distance_rank: 1, segment_length_m: 80, speed_mps: 8, dt_s: 1, heading_valid: true, gap_before: false, zero_length_arc: false}, geometry: [[51.0502,13.7375],[51.0504,13.7380]]}
  ]}
], reference_route: [101, 103]};
const payload = document.querySelector("#payload");
const status = document.querySelector("#status");
const map = L.map("map").setView([51.05, 13.737], 15);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {attribution: "&copy; OpenStreetMap contributors"}).addTo(map);
let layers = [];
document.querySelector("#sample").onclick = () => payload.value = JSON.stringify(sample, null, 2);
function draw(data) {
  layers.forEach(layer => map.removeLayer(layer)); layers = [];
  const gps = data.gps.map(point => L.circleMarker(point, {radius: 5, color: "#2563eb"}).bindTooltip("GPS observation").addTo(map));
  layers.push(...gps);
  const predicted = data.predictions.flatMap(item => item.geometry.length > 1 ? [L.polyline(item.geometry, {color:"#dc2626", weight:5}).bindTooltip(`Predicted arc ${item.arc_id}`).addTo(map)] : []);
  layers.push(...predicted);
  const reference = data.reference_geometry.map(geometry => L.polyline(geometry, {color:"#16a34a", weight:5}).bindTooltip("Reference route").addTo(map));
  layers.push(...reference);
  if (data.reference_route.length) status.textContent += `\nReference route: ${data.reference_route.join(" → ")}`;
  const points = data.gps.concat(data.predictions.flatMap(item => item.geometry), data.reference_geometry.flat());
  if (points.length) map.fitBounds(points);
}
document.querySelector("#run").onclick = async () => {
  status.textContent = "Submitting...";
  try {
    const response = await fetch(document.querySelector("#api").value.replace(/\/$/, "") + "/predict", {method:"POST", headers:{"Content-Type":"application/json"}, body:payload.value});
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || JSON.stringify(data));
    status.textContent = `Predicted route: ${data.predicted_route.join(" → ")}`;
    draw(data);
  } catch (error) { status.textContent = `Request failed: ${error.message}`; }
};
document.querySelector("#sample").click();
fetch("/model-comparison").then(response => response.json()).then(data => {
  document.querySelector("#metrics").innerHTML = data.models.map(item => `<tr>
    <td>${item.Model}</td><td>${Number(item["CV Macro F1-score"]).toFixed(4)}</td>
    <td>${Number(item["Top-1 Accuracy"]).toFixed(4)}</td>
    <td>${Number(item["Student-Test Macro F1-score"]).toFixed(4)}</td>
    <td>${Number(item["Log Loss"]).toFixed(4)}</td></tr>`).join("");
}).catch(error => {
  document.querySelector("#metrics").innerHTML = `<tr><td colspan="5">Could not load accuracy log: ${error.message}</td></tr>`;
});
</script>
</body>
</html>
